<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Seminario 2026</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      scroll-behavior: smooth;
      font-family: Arial, sans-serif;
      background: black;
	  overflow-y: hidden; /* evita scroll vertical */
	  overflow-x: hidden; /* evita scroll vertical */
    }

  /* Chrome, Safari, Edge */
  html::-webkit-scrollbar {
    display: none;
  }

  /* Firefox */
  html {
    scrollbar-width: none;
  }

  /* IE y Edge antiguos */
  body {
    -ms-overflow-style: none;
  }

 section {
  height: 100vh;

  display: flex;
  justify-content: center;
  align-items: center;

  position: relative;
  overflow: hidden;

  opacity: 0;
  transform: translateY(20px);

  transition:
    opacity 1s ease,
    transform 1s ease;
}

section.visible {
  opacity: 1;
  transform: translateY(0);
}

    section.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Hero con video */
    .hero {
      overflow: hidden;
    }
    .hero video {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
    }
    .hero h1 {
      color: white;
      font-size: 3em;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.7);
    }

    /* Bloques recurso */
    .recurso {
      display: flex;
      width: 80%;
      max-width: 1000px;
      height: 60vh;
    }

    .recurso.izquierda {
      justify-content: flex-start;
      align-items: center;
    }

    .recurso.derecha {
      justify-content: flex-end;
	  align-items: center;
    }

	.preview {
	  width: 80vw;
	  max-width: 1000px;
	  height: 75vh;
	}

    .preview iframe {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
	
#fullscreenBtn {
  position: absolute;
  top: 10px;
  right: 10px;
  padding: 12px 20px;

  width: 50px;
  height: 50px;

  background: #2c2c2c;   /* gris oscuro */
  color: white;

  border: none;
  border-radius: 50%; 
  backdrop-filter: blur(5px);
  font-size: 22px;
  cursor: pointer;

  display: flex;
  align-items: center;
  justify-content: center;

  box-shadow: 0 5px 15px rgba(0,0,0,0.3);

  z-index: 9999;

  transition: transform 0.2s ease, background 0.3s ease;
}

#fullscreenBtn:hover {
  background: #444444;   /* gris más claro al pasar el mouse */
}




  </style>
</head>
<body>

<button id="fullscreenBtn">⛶</button>
<div id="fullpage"></div>

<!-- Hero con video -->
<section id="hero" class="hero">
  <video autoplay muted loop>
    <source src="https://github.com/202003519jonatanbarillas-sudo/infogra-chin/releases/download/v1/valores.mp4" type="video/mp4">
  </video>
  <h1>SEMINARIO 2026</h1>
</section>

<!-- Sección Blockchain -->
<section id="sec1" style="background:#2c2c2c;">
  <div class="recurso derecha">
    <div class="preview">
      <iframe src="dashboard1.html"></iframe>
    </div>
  </div>
</section>

<!-- Sección Perspectivas -->
<section id="sec2" style="background:#2c2c2c;">
  <div class="recurso izquierda">
    <div class="preview">
      <iframe src="dashboard1.html"></iframe>
    </div>
  </div>
</section>

<!-- Sección Investigación -->
<section id="sec3" style="background:#2c2c2c;">
  <div class="recurso derecha">
    <div class="preview">
      <iframe src="dashboard2.html"></iframe>
    </div>
  </div>
</section>

<script>

  // =========================
  // FADE IN / OUT
  // =========================

  const observer = new IntersectionObserver((entries) => {

    entries.forEach(entry => {

      if (entry.isIntersecting) {
        entry.target.classList.add("visible");
      } else {
        entry.target.classList.remove("visible");
      }

    });

  }, { threshold: 0.3 });

  document.querySelectorAll("section").forEach(sec => {
    observer.observe(sec);
  });


  // =========================
  // FULLSCREEN
  // =========================

  const btn = document.getElementById("fullscreenBtn");

  btn.addEventListener("click", () => {

    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen();
    } else {
      document.exitFullscreen();
    }

  });


  // =========================
  // SCROLL ENTRE SECCIONES
  // =========================

  document.addEventListener("DOMContentLoaded", () => {

    const sections = document.querySelectorAll("section");

    let currentSection = 0;
    let scrolling = false;

    function scrollToSection(target) {

      sections[target].scrollIntoView({
        behavior: "smooth"
      });

    }

    function nextSection() {

      if (currentSection < sections.length - 1) {

        currentSection++;
        scrollToSection(currentSection);

      }

    }

    function prevSection() {

      if (currentSection > 0) {

        currentSection--;
        scrollToSection(currentSection);

      }

    }

    // =========================
    // RUEDA DEL MOUSE
    // =========================

    window.addEventListener("wheel", (e) => {

      if (scrolling) return;

      scrolling = true;

      if (e.deltaY > 0) {
        nextSection();
      } else {
        prevSection();
      }

      setTimeout(() => {
        scrolling = false;
      }, 900);

    });


    // =========================
    // TECLADO
    // =========================

    window.addEventListener("keydown", (e) => {

      if (e.key === "ArrowDown") {
        nextSection();
      }

      if (e.key === "ArrowUp") {
        prevSection();
      }

    });

  });

</script>


  
  
</body>
</html>
