<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Seminario 2026</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      scroll-behavior: smooth;
      font-family: Arial, sans-serif;
      background: gray;
    }

    section {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      opacity: 0;
      transform: translateY(50px);
      transition: opacity 1s ease, transform 1s ease;
    }

    section.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Hero con video */
    .hero {
      overflow: hidden;
    }
    .hero video {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
    }
    .hero h1 {
      color: white;
      font-size: 3em;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.7);
    }

    /* Bloques recurso */
    .recurso {
      display: flex;
      width: 80%;
      max-width: 1000px;
      height: 60vh;
    }

    .recurso.izquierda {
      justify-content: flex-start;
    }

    .recurso.derecha {
      justify-content: flex-end;
    }

    .preview {
      width: 600px;
      height: 100%;
    }

    .preview iframe {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    /* Navegación */
    nav {
      position: fixed;
      top: 10px;
      right: 10px;
      background: rgba(0,0,0,0.5);
      padding: 10px;
      border-radius: 8px;
    }
    nav a {
      color: white;
      text-decoration: none;
      margin: 0 8px;
      font-weight: bold;
    }
    nav a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- Barra superior -->
  <div class="topbar">
    <!-- Área izquierda -->
    <div class="left-area">
      <button class="menu-btn" onclick="toggleSidebar()">☰</button>
      <img src="https://github.com/202003519jonatanbarillas-sudo/infinal/releases/download/v7.0/logousac2.png" alt="Logo 1" class="logo">
    </div>

    <!-- Área central -->
    <div class="center-area">
      <img src="https://github.com/202003519jonatanbarillas-sudo/infinal/releases/download/v7.0/econ.png" alt="Logo 2" class="logo">
      <h1>ESCUELA DE ECONOMÍA</h1>
    </div>
    
    <div class="right-area">
      <h1>SEMINARIO 2026</h1>
    </div>
  </div>

  <!-- Panel lateral -->
  <div class="sidebar" id="sidebar">
    <a href="#" onclick="mostrar('blockchain')">Dashboard 1 (Blockchain)</a>
    <a href="#" onclick="mostrar('perspectivas')">Dashboard 2 (Perspectivas)</a>
    <a href="#" onclick="mostrar('documentos')">Documento de la Investigación</a>
  </div>

  <!-- Contenido dinámico -->
  <div class="content" id="contenido">
    <div class="scroll-area" id="scroll-area">
      <!-- Aquí se insertan los recursos dinámicos -->
    </div>
  </div>

  <!-- Librería QR -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <script>
  function toggleSidebar() {
    const sidebar = document.getElementById("sidebar");
    const content = document.getElementById("contenido");

    sidebar.classList.toggle("active");
    content.classList.toggle("shifted");
  }

  // 🔹 Bloquear flechas y redirigirlas al scroll-area
  document.addEventListener("keydown", function(e) {
    const area = document.getElementById("scroll-area");
    if (!area) return;

    if (e.key === "ArrowDown") {
      e.preventDefault();
      area.scrollBy(0, 50);
    }
    if (e.key === "ArrowUp") {
      e.preventDefault();
      area.scrollBy(0, -50);
    }
  });

  // 🔹 Función para mostrar cada sección
  function mostrar(seccion) {
    const cont = document.getElementById("contenido");
    cont.innerHTML = `<div class="scroll-area" id="scroll-area"></div>`;
    const area = document.getElementById("scroll-area");

    if (seccion === "blockchain") {
      area.innerHTML += `
        <div class="recurso">
          <div class="preview">
            <iframe src="https://202003519jonatanbarillas-sudo.github.io/DASH/dashboard%201.html"></iframe>
          </div>
        </div>`;
    }

    if (seccion === "perspectivas") {
      area.innerHTML += `
        <div class="recurso">
          <div class="preview">
            <iframe src="https://202003519jonatanbarillas-sudo.github.io/DASH/dashboard%202.html"></iframe>
          </div>
        </div>`;
    }

    if (seccion === "documentos") {
      area.innerHTML += `
        <div class="recurso">
          <div class="preview">
            <iframe src="documento_investigacion.html"></iframe>
          </div>
        </div>`;
    }
  }

  // 🔹 Al cargar la página, mostrar Dashboard 1 por defecto
  window.onload = function() {
    mostrar("blockchain");
  };
  </script>

</body>
</html>
