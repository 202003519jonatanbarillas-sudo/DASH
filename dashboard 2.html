
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Dashboard Ventas</title>

<script src="https://cdn.bokeh.org/bokeh/release/bokeh-3.9.0.min.js"></script>
<script src="https://cdn.bokeh.org/bokeh/release/bokeh-widgets-3.9.0.min.js"></script>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background-color: #F8F4F2;
  color: #2E2A2A;
  height: 100%; 
  overflow: hidden;  
}

.header {
  background-color: #EADBD6;
  padding: 20px;
  font-size: 28px;
  font-weight: bold;
  color: #3A2F2F;
  text-align: center;
  border-bottom: 1px solid #D8C7C2;
}

.container {
  display: flex;
  height: 100vh; 
  height: calc(100vh - 70px); /* ✅ ocupa toda la ventana menos el header */
  overflow-y: auto;           /* ✅ scroll solo aquí */
}


.sidebar {
  width: 220px;
  background-color: #D9B8AE;
  color: #3A2F2F;
  display: flex;
  flex-direction: column;
  padding-top: 20px;
  border-right: 1px solid #C9A39A;
  flex-shrink: 0;   /* sidebar fija */
  height: 97%;     /* ocupa todo el alto del contenedor */
}

.sidebar button {
  background: none;
  border: none;
  color: #3A2F2F;
  padding: 15px;
  text-align: left;
  cursor: pointer;
  font-size: 1em;
}

.sidebar button:hover {
  background-color: #CFA49A;
}

.sidebar button.active {
  background-color: #A44A3F;
  color: #FFFFFF;
}

.content {
  flex: 1;
  padding: 20px;
  overflow-y: auto; /* ✅ scroll solo aquí */
}

.tab { display: none; }
.tab.active { display: block; }

.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 20px;
  margin-bottom: 20px;
}

.card {
  background: #FFFFFF;
  border-radius: 14px;
  padding: 18px;
  border: 1px solid #E6D6D2;
  text-align: center;
}

.card  {
  background: #FFFFFF;
  border-radius: 14px;
  padding: 18px;
  border: 1px solid #E6D6D2;
  text-align: center;
}

.card .value {
  margin-top: 0px;
  display: flex;
  justify-content: center;
  align-items: center;
}

.card-chart {
  background: #FFFFFF;
  border-radius: 14px;
  padding: 10px;
  border: 1px solid #E6D6D2;
}

.grid-charts {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 20px;
}

.full { margin-top: 20px; }
</style>
